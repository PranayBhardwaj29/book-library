<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="top-content">
                <div class="heading">
                    <P div="heading-content" id="my">
                        MY
                    </p>
                    <p div="heading-content" id="lib">
                        LIBRARY
                    </p>
                </div>
                <div class="add-book-button">
                    <button>+ ADD BOOK</button>
                </div>
            </div>
        </header>

        <div class="cards-section">

        </div>

        <dialog class="dialog-modal1">
            <div id="dialog-wrapper1">
                <form class="book-form" id="add-form">
                    <h2>Add a book</h2>
                    <div class="form-field">
                        <label for="form-title">Title</label>
                        <input type="text" name="title" id="form-title" placeholder="Harry Potter" required>
                    </div>
                    <div class="form-field">
                        <label for=form-author>Author</label>
                        <input type="text" name="author" id="form-author" placeholder="JK Rowling" required>
                    </div>
                    <div class="form-field">
                        <label for="form-pages">pages</label>
                        <input type="number" name="pages" id="form-pages" placeholder="496" required>
                    </div>
                    <div class="read-status">
                        <input type="checkbox" class="read-toggle" id="modal-toggle1" name="read">
                        <p data-toggle-id="modal-toggle" class="modal-read-state" id="modal-toggle-text1">Not read</p>
                    </div>
                    <div class="form-btns">
                        <button type="button" id="close-add-modal">Cancel</button>
                        <button type="submit">Add Book</button>
                    </div>
                </form>
            </div>
        </dialog>

        <dialog id="dialog-modal2">
            <div id="dialog-wrapper2">
                <form class="book-form" id="edit-form">
                    <h2>Edit your book</h2>
                    <div class="form-field">
                        <label for="edit-form-title">Title</label>
                        <input type="text" name="title" id="edit-form-title" placeholder="Project Hail Mary" required>
                    </div>
                    <div class="form-field">
                        <label for=edit-form-author>Author</label>
                        <input type="text" name="author" id="edit-form-author" placeholder="Andy Weir" required>
                    </div>
                    <div class="form-field">
                        <label for="edit-form-pages">pages</label>
                        <input type="number" name="pages" id="edit-form-pages" placeholder="496" required>
                    </div>
                    <div class="read-status">
                        <input type="checkbox" class="read-toggle" id="modal-toggle2" name="read">
                        <p data-toggle-id="modal-toggle" class="modal-read-state" id="modal-toggle-text2">Not read</p>
                    </div>
                    <div class="form-btns">
                        <button type="button" id="close-edit-modal">Cancel</button>
                        <button type="submit">Edit Book</button>
                    </div>
                </form>
            </div>
        </dialog>
    </div>
</body>

</html>
